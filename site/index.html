<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="养老金融区域指数数据库首期数据门户">
  <title>养老金融区域指数数据库</title>
  <link rel="stylesheet" href="style.css?v=27aece43">
</head>
<body>
  <header class="topbar">
    <div class="brand">养老金融区域指数数据库</div>
    <div class="org">复旦大学保险应用创新研究院</div>
  <nav aria-label="资料模块" style="display:flex;gap:18px;padding:10px 0"><a href="index.html" style="color:#fff;text-decoration:none">数据查询</a><a href="policy.html" style="color:#fff;text-decoration:none">社保政策库</a></nav></header>
  <div class="layout">
    <aside class="sidebar" aria-label="指标导航">
      <div class="side-head">指标导航</div>
      <div id="scope-tabs" class="scope-tabs" aria-label="数据口径"></div>
      <div id="navigation"></div>
    </aside>
    <main>
      <div id="empty-state" class="empty-state" hidden></div>
      <section id="workspace" hidden>
        <div class="crumb"><span id="category-label"></span><span class="slash">/</span><span id="group-label"></span></div>
        <div class="title-line">
          <div>
            <h1 id="indicator-title"></h1>
            <p id="indicator-subtitle"></p>
          </div>
        </div>
        <section class="metadata" aria-label="指标元数据">
          <div><span>地区层级</span><strong id="meta-level"></strong></div>
          <div><span>覆盖期</span><strong id="meta-period"></strong></div>
          <div><span>单位</span><strong id="meta-unit"></strong></div>
        </section>
        <section class="note-strip"><strong>口径提示</strong><span id="method-note"></span></section>
        <section class="controls" aria-label="数据筛选与视图">
          <div id="region-picker" class="region-picker"></div>
          <label class="year-range">时间
            <input id="year-from" type="number" inputmode="numeric" placeholder="起始年">
            <span class="dash">至</span>
            <input id="year-to" type="number" inputmode="numeric" placeholder="结束年">
          </label>
          <span id="year-hint" class="year-hint"></span>
          <div class="view-tabs" role="tablist">
            <button class="view-button active" data-view="table" role="tab">表格</button>
            <button class="view-button" data-view="bar" role="tab">柱状图</button>
            <button class="view-button" data-view="line" role="tab">趋势图</button>
          </div>
        </section>
        <section class="data-surface">
          <div id="data-table" class="table-view"></div>
          <div id="chart-view" class="chart-view" hidden></div>
        </section>
        <section class="source-block">
          <div><span>来源机构</span><strong id="source-agency"></strong></div>
          <div><span>权威来源</span><strong id="source-detail"></strong></div>
          <div><span>统计范围</span><strong id="scope-detail"></strong></div>
          <div><span>制度对象</span><strong id="scheme-detail"></strong></div>
          <div><span>时间类型</span><strong id="time-detail"></strong></div>
          <div><span>更新日期</span><strong id="update-detail"></strong></div>
          <div><span>底库版本</span><strong>版本 v118，界面 10-10 17:31</strong></div>
        </section>
      </section>
    </main>
  </div>
  <script src="data/part01.js?v=v118"></script>
  <script src="data/part02.js?v=v118"></script>
  <script src="data/part03.js?v=v118"></script>
  <script src="data/part04.js?v=v118"></script>
  <script src="data/part05.js?v=v118"></script>
  <script src="data/part06.js?v=v118"></script>
  <script src="data/part07.js?v=v118"></script>
  <script src="data/part08.js?v=v118"></script>
  <script src="data/part09.js?v=v118"></script>
  <script src="data/part10.js?v=v118"></script>
  <script src="data/part11.js?v=v118"></script>
  <script src="data/part12.js?v=v118"></script>
  <script src="data/part13.js?v=v118"></script>
  <script src="data/version.js?v=v118"></script>
  <script src="data/portal.js?v=27aece43"></script>
  <script src="charts.js?v=27aece43"></script>
  <script src="app.js?v=27aece43"></script>
  <script>window.PORTAL_STATIC = true;</script>
  <script src="download.js?v=27aece43"></script>
  <script>
  fetch("/api/status").then(r => r.json()).then(s => {
    const el = document.getElementById("data-version");
    if (el) el.textContent = `底库 ${s.version} · ${s.records} 条记录 · ${s.indicators} 个指标`;
  }).catch(() => {});
  // 深链接：?code=指标代码&view=table|bar|line&region=地区&year=年份（也兼容 #code=...）
  (function () {
    const qs = location.search || (location.hash ? "?" + location.hash.replace(/^#\??/, "") : "");
    const q = new URLSearchParams(qs);
    const code = q.get("code"), view = q.get("view");
    const region = q.get("region"), year = q.get("year");
    if (!code && !view && !region && !year) return;
    setTimeout(() => {
      if (code) {
        const btn = document.querySelector(`[data-code="${code}"]`);
        if (btn) { btn.click(); window.scrollTo(0, 0); }
      }
      if (region) {
        const sel = document.getElementById("region-filter");
        if (sel) { sel.value = region; sel.dispatchEvent(new Event("change")); }
      }
      if (year) {
        const sel = document.getElementById("year-filter");
        if (sel) { sel.value = year; sel.dispatchEvent(new Event("change")); }
      }
      if (view) {
        const vb = document.querySelector(`.view-button[data-view="${view}"]`);
        if (vb) vb.click();
      }
    }, 150);
  })();
  // 分层导航、搜索和口径筛选统一由 app.js 管理。

  // 表格横向滚动容器：宽表在窄屏会撑破页面，这里自动包一层可滚动容器
  (function () {
    function wrap() {
      document.querySelectorAll('table.data-table').forEach(function (tb) {
        if (tb.parentElement && tb.parentElement.classList.contains('table-wrap')) return;
        var w = document.createElement('div');
        w.className = 'table-wrap';
        tb.parentNode.insertBefore(w, tb);
        w.appendChild(tb);
      });
    }
    wrap();
    var host = document.getElementById('chart') || document.body;
    try {
      new MutationObserver(wrap).observe(host, { childList: true, subtree: true });
    } catch (e) {}
  })();
  </script>
</body>
</html>
